services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCORING_PROVIDER: ${SCORING_PROVIDER:-claude}
      VISION_PROVIDER: ${VISION_PROVIDER:-gemini}
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      # Keep the vector store, database and uploads across rebuilds.
      - api-storage:/app/backend/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-storage:
