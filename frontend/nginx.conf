server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA owns routing; every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same relative /api contract the Vite dev proxy provides, so the client
    # code is identical in development and production.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model calls are slow; the default 60s would cut off a comparison.
        proxy_read_timeout 300s;
    }
}
